<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGNI Connection Test</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; background: #eef2ee; text-align: center; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
    button { padding: 15px 20px; font-size: 16px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; }
    #log { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px; text-align: left; font-family: monospace; white-space: pre-wrap; word-break: break-all; font-size: 13px; color: #333; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🌾 AGNI Live Test</h2>
    <p style="font-size: 13px; color: #666; margin-bottom: 15px;">Testing Auth Key (AQ) Connection</p>
    
    <button onclick="runTest()">TEST CONNECTION NOW 🚀</button>

    <div id="log">Status: Tap button to test connection...</div>
  </div>

  <script>
    function print(msg) {
      const logBox = document.getElementById('log');
      logBox.innerText += "\n" + msg;
    }

    // YOUR NEW AUTH KEY (AQ)
    const API_KEY = "AQ.Ab8RN6Ixol7tg0FmBxav4vzzuMOKnY9IgVED8eshqXA5K_oV0Q";

    async function runTest() {
      document.getElementById('log').innerText = "Starting test...";
      print("1. Sending request with Authorization headers...");

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_KEY}`,
            'x-goog-api-key': API_KEY
          },
          body: JSON.stringify({
            contents: [{ parts: [{ text: "Say 'AGNI is Online' in 5 words." }] }]
          })
        });

        print("2. Response status: " + response.status);

        const data = await response.json();

        if (data.error) {
          print("❌ API ERROR: " + data.error.message);
        } else if (data.candidates && data.candidates[0].content.parts[0].text) {
          print("✅ SUCCESS! AGNI Replied: " + data.candidates[0].content.parts[0].text);
        } else {
          print("⚠️ Response: " + JSON.stringify(data));
        }

      } catch (err) {
        print("❌ NETWORK ERROR: " + err.message);
      }
    }
  </script>
</body>
</html>

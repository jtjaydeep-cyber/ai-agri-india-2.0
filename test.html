<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGNI Live Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f4f4; text-align: center; }
    button { padding: 15px 25px; font-size: 18px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-weight: bold; }
    #log { margin-top: 20px; padding: 15px; background: white; border-radius: 8px; text-align: left; font-family: monospace; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>

  <h2>🌾 AGNI Live Connection Test</h2>
  <p>Tap the button below to force a direct query to Gemini.</p>
  
  <button onclick="runTest()">TEST CONNECTION NOW 🚀</button>

  <div id="log">Status: Ready. Tap button...</div>

  <script>
    function print(msg) {
      const logBox = document.getElementById('log');
      logBox.innerText += "\n" + msg;
      console.log(msg);
    }

    const API_KEY = "AQ.Ab8RN6KKDT2U_OGNhDq-zAqEd7_qdIkvz1QIbFC_3w1UCiRCgA";

    async function runTest() {
      document.getElementById('log').innerText = "Starting test...";
      
      if (API_KEY.includes("YOUR_GEMINI")) {
        print("❌ ERROR: You didn't replace YOUR_GEMINI_API_KEY_HERE in test.html!");
        return;
      }

      print("1. Sending request to Google Gemini API...");

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: "Say 'AGNI is Online' in 5 words." }] }]
          })
        });

        print("2. Response status received: " + response.status);

        const data = await response.json();

        if (data.error) {
          print("❌ API ERROR: " + data.error.message);
        } else if (data.candidates && data.candidates[0].content.parts[0].text) {
          print("✅ SUCCESS! AGNI Replied: " + data.candidates[0].content.parts[0].text);
        } else {
          print("⚠️ Unexpected response format: " + JSON.stringify(data));
        }

      } catch (err) {
        print("❌ NETWORK/CORS ERROR: " + err.message);
      }
    }
  </script>
</body>
</html>
